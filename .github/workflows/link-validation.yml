name: Validate Links

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    # Weekly external-link check: Monday at 12:17 UTC
    - cron: "17 12 * * 1"

permissions:
  contents: read

jobs:

  internal-links:
    name: Internal Link Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Build site strictly
        run: mkdocs build --clean --strict

      - name: Validate rendered internal links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          format: markdown
          jobSummary: true
          args: >-
            --offline
            --root-dir "${{ github.workspace }}/site"
            --index-files index.html
            --fallback-extensions html
            --no-progress
            --verbose
            'site/**/*.html'

  external-links:
    name: External Link Validation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Build site strictly
        run: mkdocs build --clean --strict

      - name: Restore Lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: |
            lychee-

      - name: Validate internal and external links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          format: markdown
          jobSummary: true
          token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            --root-dir "${{ github.workspace }}/site"
            --index-files index.html
            --fallback-extensions html
            --cache
            --max-cache-age 7d
            --max-retries 1
            --max-concurrency 8
            --no-progress
            --verbose
            'site/**/*.html'
