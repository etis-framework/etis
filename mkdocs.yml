site_name: Engineering Trustworthy Intelligent Systems
site_url: https://etisframework.org/
site_description: Software Engineering, Governance, and Operational Trust in the AI Era
site_author: William O'Connell, Ph.D.

repo_url: https://github.com/etis-framework/etis
repo_name: etis-framework/etis

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.ico
  logo: assets/etis-logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - stylesheets/publications.css
  - stylesheets/publications-epas.css
  - stylesheets/publication-navigation-cards.css

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - attr_list
  - toc:
      permalink: true

